name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Build
        run: npm run build

      - name: Pack release tarball
        run: |
          tar -czf enterprise-kb-${{ github.ref_name }}.tar.gz \
            dist \
            public \
            packages/claude-tools-kit/dist \
            package.json \
            package-lock.json \
            README.md \
            CHANGELOG.md \
            DEPLOYMENT.md \
            RELEASE.md \
            AGENTS.md \
            SECURITY_OWNERSHIP.md \
            Dockerfile \
            docker-compose.yml \
            .env.example

      - name: Extract release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: enterprise-kb-${{ github.ref_name }}.tar.gz
          body_path: release-notes.md
