<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · 企业知识库</title>
  <script>
    if (localStorage.getItem('kb_theme') === 'dark' || (!localStorage.getItem('kb_theme') && matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.dataset.theme = 'dark'
    }
  </script>
  <link href="/vendor/inter/wght.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=44">
</head>
<body class="login-page">
  <main class="login-wrap">
    <div class="login-head">
      <span class="login-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
      </span>
      <h1 class="login-title">登录企业知识库</h1>
      <p class="login-sub">用公司分配的账号登录</p>
    </div>

    <form class="login-box" id="login-form">
      <div class="login-error" id="login-error" role="alert"></div>
      <div class="form-group">
        <label class="form-label" for="username">用户名</label>
        <input class="input" id="username" type="text" placeholder="请输入用户名" autocomplete="username" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">密码</label>
        <input class="input" id="password" type="password" placeholder="请输入密码" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary login-submit" type="submit" id="login-btn">登录</button>
    </form>

    <p class="login-foot">忘记密码请联系管理员重置</p>
  </main>

  <script>
    if (localStorage.getItem('kb_token')) location.href = '/index.html'

    document.getElementById('login-form').addEventListener('submit', async e => {
      e.preventDefault()
      const btn = document.getElementById('login-btn')
      const errEl = document.getElementById('login-error')
      errEl.style.display = 'none'
      btn.disabled = true
      btn.textContent = '登录中…'

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
          }),
        })
        const data = await res.json()
        if (!res.ok) throw new Error(data.error ?? '用户名或密码错误')

        localStorage.setItem('kb_token', data.token)
        localStorage.setItem('kb_user', JSON.stringify(data.user))
        location.href = '/index.html'
      } catch (err) {
        errEl.textContent = err.message
        errEl.style.display = 'block'
        btn.disabled = false
        btn.textContent = '登录'
      }
    })
  </script>
</body>
</html>
